<div class="barra-herramientas">
  <h2>Usuarios</h2>
  <span class="espaciador"></span>
  <input class="buscador" type="search" placeholder="Buscar…" aria-label="Buscar" (input)="filtrar($event)" />
  <a matButton="filled" routerLink="/admin/usuarios/nuevo"><mat-icon>add</mat-icon> Nuevo</a>
</div>

<div class="tabla-scroll">
  <table mat-table [dataSource]="datos" matSort class="tabla-material">
    <ng-container matColumnDef="idUsuario">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idUsuario }}</td>
    </ng-container>
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
      <td mat-cell *matCellDef="let row">{{ row.username }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let row">{{ row.email }}</td>
    </ng-container>
    <ng-container matColumnDef="segmento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Segmento</th>
      <td mat-cell *matCellDef="let row">{{ row.segmento || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="rol">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
      <td mat-cell *matCellDef="let row">{{ row.rol }}</td>
    </ng-container>
    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let row">{{ row.activo ? 'Activo' : 'Inactivo' }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <a matIconButton [routerLink]="['/admin/usuarios/editar', row.idUsuario]" aria-label="Editar"><mat-icon>edit</mat-icon></a>
        <button matIconButton type="button" (click)="abrirDialogo(row)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell vacio" [attr.colspan]="columnas.length">{{ cargando() ? 'Cargando…' : 'Sin registros' }}</td>
    </tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
