<div class="barra-herramientas">
  <h2>Auditoría</h2>
  <span class="espaciador"></span>
  <input class="buscador" type="search" placeholder="Buscar…" aria-label="Buscar" (input)="filtrar($event)" />
</div>

<div class="tabla-scroll">
  <table mat-table [dataSource]="datos" matSort class="tabla-material">
    <ng-container matColumnDef="idAuditoria">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idAuditoria }}</td>
    </ng-container>
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
      <td mat-cell *matCellDef="let row">{{ row.fecha | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>
    <ng-container matColumnDef="usuario">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
      <td mat-cell *matCellDef="let row">{{ row.usuario }}</td>
    </ng-container>
    <ng-container matColumnDef="accion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Acción</th>
      <td mat-cell *matCellDef="let row">{{ row.accion }}</td>
    </ng-container>
    <ng-container matColumnDef="tabla">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tabla</th>
      <td mat-cell *matCellDef="let row">{{ row.tabla }}</td>
    </ng-container>
    <ng-container matColumnDef="detalle">
      <th mat-header-cell *matHeaderCellDef>Detalle</th>
      <td mat-cell *matCellDef="let row">{{ row.detalle }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell vacio" [attr.colspan]="columnas.length">{{ cargando() ? 'Cargando…' : 'Sin registros' }}</td>
    </tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
