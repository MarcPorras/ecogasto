<div class="admin-layout">
  <aside class="admin-menu">
    <div class="admin-marca">
      <img src="images/LOGO.png" alt="EcoGasto" />
      <span>Administración</span>
    </div>
    <nav>
      @for (s of secciones; track s.ruta) {
        <a [routerLink]="['/admin/' + s.ruta]" routerLinkActive="activo">
          <mat-icon>{{ s.icono }}</mat-icon>
          <span>{{ s.etiqueta }}</span>
        </a>
      }
    </nav>
    <div class="admin-pie">
      <small>{{ usuario }}</small>
      <button matButton="outlined" type="button" (click)="salir()"><mat-icon>logout</mat-icon> Salir</button>
    </div>
  </aside>
  <main class="admin-contenido">
    <router-outlet />
  </main>
</div>
