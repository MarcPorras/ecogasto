<div class="barra-herramientas">
  <h2>Retos</h2>
  <span class="espaciador"></span>
  <input class="buscador" type="search" placeholder="Buscar…" aria-label="Buscar" (input)="filtrar($event)" />
  <a matButton="filled" routerLink="/admin/retos/nuevo"><mat-icon>add</mat-icon> Nuevo</a>
</div>

<div class="tabla-scroll">
  <table mat-table [dataSource]="datos" matSort class="tabla-material">
    <ng-container matColumnDef="idReto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idReto }}</td>
    </ng-container>
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
      <td mat-cell *matCellDef="let row">{{ row.titulo }}</td>
    </ng-container>
    <ng-container matColumnDef="recurso">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Recurso</th>
      <td mat-cell *matCellDef="let row">{{ row.recurso }}</td>
    </ng-container>
    <ng-container matColumnDef="metaPorcentaje">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Meta (%)</th>
      <td mat-cell *matCellDef="let row">{{ row.metaPorcentaje }}</td>
    </ng-container>
    <ng-container matColumnDef="puntos">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Puntos</th>
      <td mat-cell *matCellDef="let row">{{ row.puntos }}</td>
    </ng-container>
    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
      <td mat-cell *matCellDef="let row">{{ row.activo ? 'Activo' : 'Inactivo' }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <a matIconButton [routerLink]="['/admin/retos/editar', row.idReto]" aria-label="Editar"><mat-icon>edit</mat-icon></a>
        <button matIconButton type="button" (click)="abrirDialogo(row)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell vacio" [attr.colspan]="columnas.length">{{ cargando() ? 'Cargando…' : 'Sin registros' }}</td>
    </tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
