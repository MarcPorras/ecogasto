<div class="barra-herramientas">
  <h2>Tarifas</h2>
  <span class="espaciador"></span>
  <input class="buscador" type="search" placeholder="Buscar…" aria-label="Buscar" (input)="filtrar($event)" />
  <a matButton="filled" routerLink="/admin/tarifas/nuevo"><mat-icon>add</mat-icon> Nuevo</a>
</div>

<div class="tabla-scroll">
  <table mat-table [dataSource]="datos" matSort class="tabla-material">
    <ng-container matColumnDef="idTarifa">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.idTarifa }}</td>
    </ng-container>
    <ng-container matColumnDef="recurso">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Recurso</th>
      <td mat-cell *matCellDef="let row">{{ row.recurso }}</td>
    </ng-container>
    <ng-container matColumnDef="zona">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Zona</th>
      <td mat-cell *matCellDef="let row">{{ row.zona }}</td>
    </ng-container>
    <ng-container matColumnDef="tarifa">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tarifa</th>
      <td mat-cell *matCellDef="let row">{{ row.tarifa }}</td>
    </ng-container>
    <ng-container matColumnDef="umbralBajo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Umbral bajo</th>
      <td mat-cell *matCellDef="let row">{{ row.umbralBajo }}</td>
    </ng-container>
    <ng-container matColumnDef="umbralAlto">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Umbral alto</th>
      <td mat-cell *matCellDef="let row">{{ row.umbralAlto }}</td>
    </ng-container>
    <ng-container matColumnDef="promedioNacional">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Promedio nacional</th>
      <td mat-cell *matCellDef="let row">{{ row.promedioNacional }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <a matIconButton [routerLink]="['/admin/tarifas/editar', row.idTarifa]" aria-label="Editar"><mat-icon>edit</mat-icon></a>
        <button matIconButton type="button" (click)="abrirDialogo(row)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell vacio" [attr.colspan]="columnas.length">{{ cargando() ? 'Cargando…' : 'Sin registros' }}</td>
    </tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons />
