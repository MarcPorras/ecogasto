spring.application.name=ecogasto

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecogasto_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

ecogasto.jwt.secret=${JWT_SECRET:EcoGasto-UPC-2026-clave-secreta-para-firmar-jwt}
ecogasto.jwt.expiration-ms=28800000

ecogasto.ia.api-key=${GEMINI_API_KEY:AQ.Ab8RN6LMrfLpWKIKi5ptqTXo0TQRqmQkYvS60HeMwVNITVyCBQ}
ecogasto.ia.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

springdoc.swagger-ui.path=/swagger-ui.html
